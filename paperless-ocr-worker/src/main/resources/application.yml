spring:
  application:
    name: paperless-ocr-worker
  main:
    web-application-type: none
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:paperless}
    password: ${RABBITMQ_PASSWORD:paperless}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: 1
