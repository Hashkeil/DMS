services:
  paperless-ui:
    build:
      context: paperless-ui
    ports:
      - "80:80"
    depends_on:
      - paperless-rest

  paperless-rest:
    build:
      context: .
      dockerfile: paperless-rest/Dockerfile
    # Internal only: reachable from the UI container via nginx (/api), not from the host.
    expose:
      - "8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DDL_AUTO: ${DDL_AUTO:-update}
      POSTGRES_DB: ${POSTGRES_DB:-paperless}
      POSTGRES_USER: ${POSTGRES_USER:-paperless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperless}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paperless}
      POSTGRES_USER: ${POSTGRES_USER:-paperless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperless}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
