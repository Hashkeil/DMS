services:
  paperless-ui:
    build:
      context: paperless-ui
    ports:
      - "80:80"
    depends_on:
      - paperless-rest

  paperless-rest:
    build:
      context: .
      dockerfile: paperless-rest/Dockerfile
    # Internal only: reachable from the UI container via nginx (/api), not from the host.
    expose:
      - "8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-paperless}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-paperless}
      RUSTFS_URL: http://rustfs:9000
      ELASTICSEARCH_URL: http://elasticsearch:9200
      DDL_AUTO: ${DDL_AUTO:-update}
      POSTGRES_DB: ${POSTGRES_DB:-paperless}
      POSTGRES_USER: ${POSTGRES_USER:-paperless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperless}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-paperless}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-paperless}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  paperless-ocr-worker:
    build:
      context: .
      dockerfile: paperless-ocr-worker/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-paperless}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-paperless}
      RUSTFS_URL: http://rustfs:9000
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - rustfs-data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paperless}
      POSTGRES_USER: ${POSTGRES_USER:-paperless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperless}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rustfs-data:
  rabbitmq-data:
  postgres-data:
