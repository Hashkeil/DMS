spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:paperless}
    password: ${RABBITMQ_PASSWORD:paperless}
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  application:
    name: paperless-rest
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paperless}
    username: ${DB_USERNAME:paperless}
    password: ${DB_PASSWORD:paperless}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false

server:
  port: 8081

paperless:
  storage:
    directory: ${UPLOAD_DIRECTORY:./uploads}
