server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy: the browser only talks to nginx; paperless-rest is not exposed to the host.
    location /api/ {
        proxy_pass http://paperless-rest:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular routes (/, /documents/new, /documents/42) are resolved client-side,
    # so unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
